<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales - Ejercicio 10</title>
</head>
<body>
    <h1>Condicionales 10</h1>
        <script>
        let edad;

        
        edad=prompt("¿Cuántos años tienes?","0")

        if(edad>=18 && edad<121){
            document.write("Tienes permiso de acceso")
        }else{
            document.write("Lo siento. No tienes acceso a la web");
        }
        </script>
</body>
