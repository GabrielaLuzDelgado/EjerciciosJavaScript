<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales - Ejercicio 13</title>

        <script>
        let edad, final;
        edad=prompt("edad?","0");

        if (isNaN(edad)){
            final="Error. No es un número";
        }else{
            final=(edad<18)? "Demasiado jóven":"Mayor de edad"
        }
        document.write(final);

    </script>
</head>
<body>
    <h1>Condicionales 13</h1>
    <p>Código en el head</p>


</body>
</html>
