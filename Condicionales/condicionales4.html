<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales - Ejercicio 4</title>
</head>

<body>
    <h1>Condicionales 4</h1>
        <script>
        let dato1, dato2, num1, num2, resultado;

        dato1=window.prompt("Primer numero?","0");
        num1=parseInt(dato1);

        dato2=window.prompt("Segundo numero?","0");
        num2=parseInt(dato2);   
        if (num1>num2){
            resultado="El primer número es mayor";
        } else if (num1<num2){
            resultado="El segundo número es mayor";
        }else{
            resultado="Ambos números son iguales";
        }
        document.write( ` <h3>${resultado}</h3> `);
    </script>
</body>
</html>
