<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales - Ejercicio 12</title>
    <script>    
    let num=1;
    let dato;

    while(num<10){
        dato=prompt('Introduce número menor que 10:','');
        num=parseInt(dato);

        document.write(`${num}<br>`);
    }
    document.write("Fin de programa");

    </script>
</head>
<body>
    <h1>Condicionales 12</h1>
    <p>Código en el head</p>


</body>
</html>
