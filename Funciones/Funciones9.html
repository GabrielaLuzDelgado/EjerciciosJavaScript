<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones - Ejercicio 9</title>
</head>
<body>

<script>
    function mostrarSuma(num1, num2) {
    const suma = num1 + num2;
    console.log(`La suma de ${num1} y ${num2} es: ${suma}`);
    alert(`La suma de ${num1} y ${num2} es: ${suma}`);
    }

    let entrada1 = prompt("Introduce el primer número:");
    let entrada2 = prompt("Introduce el segundo número:");

    let numero1 = parseFloat(entrada1);
    let numero2 = parseFloat(entrada2);

    if (isNaN(numero1) || isNaN(numero2)) {
        alert("Error: Debes introducir valores numéricos válidos.");
    } else {
        mostrarSuma(numero1, numero2);
    }

    </script>

</body>
</html>
