<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones - Ejercicio 6</title>
</head>
<body>
    <script>
        let pasaralFarenheit= (grado)=> {
            return Farenheit = grado * 1.8 + 32;};

        let celsius= parseFloat(prompt("Dime los grados Celsius:"));    
        var result = pasaralFarenheit(celsius);
        alert(`${celsius} grados Celsius son ${result} grados Farenheit`);
        

    </script>
    
</body>
</html>
