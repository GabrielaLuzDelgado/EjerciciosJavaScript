<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Ejercicio 9</title>
</head>
<body>
    <h1>Inicio - Ejercicio 9</h1>
    <p> innerHtml controla que puede incluirse en un elemento</p>
    <div id="salida"></div>
    
    <script>
        let dato, num;

        dato=window.prompt("Introduce un número ?","0");
        num= parseInt(dato);

        let resultado = num*2;

        document.getElementById("salida").innerHTML = (`El doble es ${resultado}`) ;


    </script>

</body>
</html>
