<body>
    <h1>Inicio - Ejercicio 4</h1>
    <h2>Ejemplo de concatenar</h2>
    <script type="text/javascript">
        const a="¡Hola ";
        let b="mundo!";

        document.write("Constante a contiene " + a);
        document.write("</br>");
        document.write("Constante b contiene " + b);
        document.write("</br>");
        document.write(a+b);


    </script>
    <p>El signo '+' sirve pra concatenar cadenas de texto</p>
