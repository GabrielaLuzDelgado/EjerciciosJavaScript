<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Ejercicio 7</title>
</head>
<body>
    <h1>Inicio - Ejercicio 7</h1>
    <script>
        let dato, num;
        
        dato=window.prompt("Introduce número ?","0");
        num=parseInt(dato);

        num=num*2 ;

        document.write(`El doble es ${num}`);

        
    </script>
    <p>Los números por teclado son letras. Tiene que convertirse</p>
    <p>Se usa "parseInt" pasar a entero</p>

</body>
</html>
