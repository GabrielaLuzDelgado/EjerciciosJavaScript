<html lang="en">
<head>

<body>
    <h1>Inicio - Ejercicio 13</h1>
    <script language="javascript">
{
    var contador;
    contador=1;

    while(contador<5){

    var dato=prompt(`Introduce el número del 1 al 10:`, ''); // correccion let por var
    let num=parseInt(dato);

    document.write(`El numero introducido es ${num}</br>`);
    document.write(`El contador correcto es ${contador}</br>`);

    contador=contador+1;

    }
    document.write(`</br><h2>
                Fin del programa
                contador ya NO es menor que 5.
                </h2>`);
    document.write(`</br> Ultimo numero introducido es ${num}`)            
}
    </script>

    <p>Corregir el error no permite ver el ultimo document.write?</p>
</body>
