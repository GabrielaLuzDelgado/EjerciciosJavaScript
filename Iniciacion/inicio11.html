<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Ejercicio 11</title>
</head>
<body>
    <h1>Inicio - Ejercicio 11</h1>
    <h2>Mi programa de Resta y Multiplicación</h2>
    <script>
        let dato1, dato2, num1, num2;

        dato1=window.prompt("Introduce primer número ", "0");
        num1=parseInt(dato1);
        dato2=window.prompt("Introduce segundo número ", "0");
        num2=parseInt(dato2);

        let resta = num1-num2;

        let multiplicacion = num1*num2;


        document.write(`<br/> Tu primer número introducido es ${num1}`);
        document.write(`<br/> Tu segundo número introducido es ${num2}`);

        document.write(`<br/> <br/> El resultado del primer número menos el segundo número es ${resta}`);

        document.write(`<br/> <br/> El resultado del primer número multiplicado por el segundo número es ${multiplicacion}`);


    </script>

    
</body>
</html>
