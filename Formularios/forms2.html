<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>



<script>
    function calcular10()
    {
        const dato=parseFloat(document.formulario.numero.value);
        let porCiento =(dato*0.1); 
        document.getElementById("resultado").innerHTML=`El 10% de ${dato} es: ${porCiento} <br>` 
    }


</script>

</head>
<body>

    <h1>Ejercicio 2</h1>
    <p>Realizar un programa en el cual el usuario introduce un valor en un Form y por pantalla sale como resultado el 10%</p>
    <form name="formulario" onsubmit="event.preventDefault(); calcular10();">
        <label for="numero">Introduce un número:</label>
        <input type="number" id="numero" required>
        <button type="submit">Calcular</button>
    </form>
    <p id="resultado"></p>

</body>
</html>
